appId: box.reward.android.app.dev
---
- runFlow: PixelOnboarding-dev.yaml
- launchApp:
    appId: com.ubercab
- extendedWaitUntil:
    visible:
      id: title
    timeout: 10000
- repeat:
    while:
      visible:
        id: title
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 1000
- tapOn:
    id: com.ubercab:id/welcome_screen_continue
- tapOn:
    id: PHONE_COUNTRY_CODE
- tapOn:
    id: PHONE_NUMBER
- inputRandomNumber:
    length: 8
- launchApp:
    appId: box.reward.android.app.dev
    clearState: false
    stopApp: false
- tapOn:
    text: homePageTitle
    repeat: 6
    delay: 500
- scrollUntilVisible:
    element: View Screen Node Records
    direction: DOWN
    timeout: 50000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- tapOn: View Screen Node Records
- scrollUntilVisible:
    element: .*VIEW_CLICKED.*
    direction: DOWN
    timeout: 50000
    speed: 70
    visibilityPercentage: 100
    centerElement: false
- assertVisible:
    text: .*VIEW_CLICKED.*
    enabled: true
- scrollUntilVisible:
    element: .*Get Started.*
    direction: DOWN
    timeout: 50000
    speed: 70
    visibilityPercentage: 100
    centerElement: false
- assertVisible:
    text: .*Get Started.*
    enabled: true